name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          export PATH="$JAVA_HOME_17_X64/bin:$PATH"
          ./build.sh
          cd dist && sha256sum chromapatch-*.jar | tee SHA256SUMS
      - name: Check signed updates
        run: |
          if [ -f updates/manifest.properties ]; then
            "$JAVA_HOME_17_X64/bin/java" -cp "$(ls dist/chromapatch-*-forge1201-*.jar)" obs07.chroma.update.Check updates
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars
          path: |
            dist/chromapatch-*.jar
            dist/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "SHA-256 in SHA256SUMS" dist/*
